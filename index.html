<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Wagon | Home Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- --navbar -->
    <nav class="navbar">
      <div class="site-container nav-contant">
        <div class="logo">
          <img src="Assest/Logo.png" alt="logo" />
        </div>
        <div class="site-center-text">
          <span>Deliver to: </span>

          <i class="fa-solid fa-location-dot"></i>
          <span style="font-weight: 400">Current Location </span>

          <span>Lee market khajoor bazar, karachi</span>
        </div>

        <div class="buttons">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              name="search"
              id="search"
              name="search"
              placeholder="Search Food"
            />
          </div>

          <div class="login-btn">
            <i class="fa-solid fa-user"></i>
            <button type="button">Login</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- hero-section -->
    <section class="site-hero-section">
      <div class="site-container">
        <div class="row align-items-center">
          <div class="col-md-7">
            <div class="left-side-con">
              <h1>Are you starving?</h1>
              <p>
                Within a few clicks, find meals that are accessible near you
              </p>

              <div class="pic-and-drop-box">
                <div class="pic-and-drop-btns">
                  <div class="btn1 login-btn active">
                    <i class="fa-solid fa-motorcycle"></i>
                    <button type="button">Delivery</button>
                  </div>

                  <div class="btn2 login-btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <button type="button">Pickup</button>
                  </div>
                </div>

                <div class="line-pic-drop"></div>

                <div class="pic-and-drop-serach">
                  <div class="Serach-box-pic search-box">
                    <i class="fa-solid fa-location-dot"></i>
                     <input
              type="text"
              name="search"
              id="search"
              name="search"
              placeholder="Enter  Your Address"
            />
                  </div>

                  <div class="btnn2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <button type="button">Find Food</button>
                  </div>
                </div>
              </div>
            </div>
          </div>


          <div class="col-md-5">
            <div class="hero-image">
              <img src="Assest/Image.png" alt="">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ----------------Bootstrap_JS_LINK----------------------------- -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
